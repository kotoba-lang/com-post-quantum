name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          bb: latest
          cli: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: ./run_tests.sh
      - run: python -m unittest discover -s tests -v
      - run: clojure -M:lint
